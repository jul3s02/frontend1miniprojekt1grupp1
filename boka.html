<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/commonStyle.css">
    <link rel="stylesheet" href="css/boka.css">
</head>
<body>
    <!-- Gemensamm för alla sidor -->
    <header>
        <section class="headerTitel"
            <h1>
                Cafe Solsidan
            </h1>
            <p>
                Välkommen till den soliga sidan!
            </p>
        </section>
        <nav>
            <a title="Navigera till startsidan" href="index.html">Startsida</a>
            <a title="Navigera till vår meny" href="meny.html">Meny</a>
            <a title="Navigera till bokningsformuläret" href="boka.html">Boka</a>
            <a title="Navigera till om oss sidan" href="om.html">Om oss</a>
        </nav>
    </header>
    <main>
<section class="booking-section">
            <h1>Boka bord</h1>
            <p>Vill du besoke Solsidan i Storgatan? Boka ditt bord idag!</p>

            <form action="#">
                <div class="form-group">
                    <label for="name">Namn:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-post:</label>
                    <input type="email" id="email" name="email" required>
                </div>
<div class="form-group">
                    <label for="phone">Telefonnummer:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="date">Datum:</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="time">Tid:</label>
                    <input type="time" id="time" name="time" required>
                </div>

                <div class="form-group">
                    <label for="guests">Antal gäster:</label>
                    <input type="number" id="guests" name="guests" min="1" max="20" required>
                </div>
                <div class="form-group">
                    <label for="message">Meddelande eller Önskmål</label>
                    <textarea id="message" name="message" rows="5"></textarea>

                 <button type="submit">Skicka</button>
                <div class="confirmation-message" id="confirmationMessage"></div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy;Cafe Solsidan</p>
    </footer>

</body>
</html>
